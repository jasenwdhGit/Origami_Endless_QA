<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>折纸刷题自习室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <img src="logo.png" alt="logo" width="32" height="32" style="border-radius: 8px; object-fit: contain;">
                    <div class="logo-content">
                        <span class="logo-text">折纸刷题自习室</span>
                        <span class="logo-author">Author: Yamazaki Kaoru</span>
                    </div>
                </div>
            </div>
            <div class="header-center" id="modeTabs" style="display: none;">
                <button class="mode-tab active" data-mode="sequence">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                    </svg>
                    顺序刷题
                </button>
                <button class="mode-tab" data-mode="random">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
                    </svg>
                    随机刷题
                </button>
                <button class="mode-tab" data-mode="review">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    错题复习
                    <span class="badge" id="wrongCount">0</span>
                </button>
            </div>
            <div class="header-right">
                <div class="stats-mini" id="statsMini" style="display: none;">
                    <span class="stat-item correct">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                        <span id="correctCount">0</span>
                    </span>
                    <span class="stat-item wrong">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                        <span id="wrongCountMini">0</span>
                    </span>
                </div>
                <button class="btn-icon" id="homeBtn" style="display: none;" title="返回首页">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <path d="M9 22V12h6v10"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Home View -->
            <section class="view active" id="homeView">
                <!-- 题库列表区域 -->
                <div class="question-bank-section" id="questionBankSection">
                    <div class="question-bank-header">
                        <span class="question-bank-title">已上传的题库</span>
                    </div>
                    <div class="question-bank-list" id="questionBankList"></div>
                </div>

                <div class="upload-section">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <h2 class="upload-title">上传题目文件</h2>
                        <p class="upload-hint">拖拽 Excel 文件到此处，或点击选择文件</p>
                        <p class="upload-format">支持 .xlsx, .xls 格式</p>
                        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
                        <button class="btn btn-primary" id="selectFileBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            选择文件
                        </button>
                    </div>

                    <div class="upload-format-example">
                        <h3>Excel 格式要求</h3>
                        <div class="format-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>正确答案</th>
                                        <th>题目内容</th>
                                        <th>选项A</th>
                                        <th>选项B</th>
                                        <th>选项C</th>
                                        <th>选项D</th>
                                        <th>...</th>
                                        <th>选项J</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>B</td>
                                        <td>中国的首都是？</td>
                                        <td>上海</td>
                                        <td>北京</td>
                                        <td>广州</td>
                                        <td>深圳</td>
                                        <td>...</td>
                                        <td>-</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <p class="upload-hint" style="margin-top: 8px; font-size: 12px;">支持 A-J 共10个选项</p>
                        <a href="sample.xlsx" download class="btn btn-secondary btn-sm">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            下载示例文件
                        </a>
                    </div>
                </div>

                <div class="history-section" id="historySection" style="display: none;">
                    <h3>刷题历史</h3>
                    <div class="history-list" id="historyList"></div>
                </div>
            </section>

            <!-- Quiz View -->
            <section class="view" id="quizView">
                <div class="quiz-container" id="quizContainer">
                    <div class="progress-bar">
                        <div class="progress-track" id="progressTrack">
                            <div class="progress-fill" id="progressFill"></div>
                            <div class="progress-dots" id="progressDots"></div>
                        </div>
                        <span class="progress-text" id="progressText">0 / 0</span>
                        <button class="picker-trigger" id="pickerTrigger" title="查看所有题目">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"/>
                                <rect x="14" y="3" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/>
                                <rect x="14" y="14" width="7" height="7"/>
                            </svg>
                        </button>
                    </div>


                    <!-- 题目选择悬浮窗 -->
                    <div class="question-picker" id="questionPicker">
                        <div class="picker-header">
                            <span class="picker-title">题目导航</span>
                            <div class="picker-legend">
                                <div class="picker-legend-item">
                                    <span class="picker-legend-dot current"></span>
                                    <span>当前</span>
                                </div>
                                <div class="picker-legend-item">
                                    <span class="picker-legend-dot correct"></span>
                                    <span>正确</span>
                                </div>
                                <div class="picker-legend-item">
                                    <span class="picker-legend-dot wrong"></span>
                                    <span>错误</span>
                                </div>
                                <div class="picker-legend-item">
                                    <span class="picker-legend-dot skipped"></span>
                                    <span>跳过</span>
                                </div>
                            </div>
                        </div>
                        <div class="picker-grid" id="pickerGrid"></div>
                    </div>

                    <div class="question-navigation">
                        <button class="nav-btn prev" id="prevBtn" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 18l-6-6 6-6"/>
                            </svg>
                            上一题
                        </button>
                        <div class="current-indicator" id="currentIndicator">1</div>
                        <button class="nav-btn next" id="nextQuestionBtn" disabled>
                            下一题
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 18l6-6-6-6"/>
                            </svg>
                        </button>
                    </div>

                    <div class="question-card" id="questionCard">
                        <div class="question-header">
                            <span class="question-number" id="questionNumber">第 1 题</span>
                            <span class="question-type" id="questionType">单选题</span>
                        </div>
                        <div class="question-content" id="questionContent">
                            题目内容将显示在这里
                        </div>
                        <div class="options-list" id="optionsList"></div>
                    </div>

                    <div class="quiz-actions">
                        <button class="btn btn-primary btn-lg" id="submitBtn" disabled>
                            确认答案
                        </button>
                        <button class="btn btn-secondary btn-lg" id="nextBtn" style="display: none;">
                            下一题
                        </button>
                    </div>
                </div>
            </section>

            <!-- Result View -->
            <section class="view" id="resultView">
                <div class="result-container">
                    <div class="result-card">
                        <div class="result-icon" id="resultIcon">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                        </div>
                        <h2 class="result-title" id="resultTitle">刷题完成!</h2>
                        <div class="result-stats">
                            <div class="stat-card">
                                <span class="stat-value" id="totalQuestions">0</span>
                                <span class="stat-label">总题数</span>
                            </div>
                            <div class="stat-card correct">
                                <span class="stat-value" id="finalCorrect">0</span>
                                <span class="stat-label">正确</span>
                            </div>
                            <div class="stat-card wrong">
                                <span class="stat-value" id="finalWrong">0</span>
                                <span class="stat-label">错误</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-value" id="accuracy">0%</span>
                                <span class="stat-label">正确率</span>
                            </div>
                        </div>
                        <div class="wrong-list" id="wrongList" style="display: none;">
                            <h3>错题回顾</h3>
                            <div class="wrong-items" id="wrongItems"></div>
                        </div>
                        <div class="result-actions">
                            <button class="btn btn-secondary" id="reviewWrongBtn" style="display: none;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                    <path d="M2 17l10 5 10-5"/>
                                </svg>
                                复习错题
                            </button>
                            <button class="btn btn-primary" id="restartBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6"/>
                                    <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
                                </svg>
                                重新开始
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast Notification -->
        <div class="toast" id="toast">
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/excel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
